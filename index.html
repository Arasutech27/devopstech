<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Animated Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #080b18;
            color: white;
        }

        /* Animated background */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }

        .orb {
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            filter: blur(4px);
            opacity: 0.65;
            animation: float 8s ease-in-out infinite alternate;
        }

        .orb.one {
            background: #00e5ff;
            top: 8%;
            left: 10%;
        }

        .orb.two {
            background: #9b35ff;
            bottom: 8%;
            right: 10%;
            animation-delay: 2s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(60px, -40px) scale(1.2);
            }
        }

        /* Login card */

        .login-card {
            width: min(90%, 390px);
            padding: 40px 32px;
            background: rgba(12, 17, 35, 0.82);
            border: 1px solid rgba(0, 229, 255, 0.5);
            border-radius: 22px;
            backdrop-filter: blur(18px);
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.18);
            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            border: 2px solid #00e5ff;
            border-radius: 18px;
            color: #00e5ff;
            font-size: 30px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aab4d0;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #dce6ff;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #303b58;
            border-radius: 10px;
            outline: none;
            background: #10172b;
            color: white;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
        }

        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 4px 0 24px;
            font-size: 12px;
            color: #b7c1dc;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .remember input {
            width: auto;
            accent-color: #00e5ff;
        }

        .options a,
        .signup a {
            color: #00e5ff;
            text-decoration: none;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #00c9ff, #6555ff);
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 201, 255, 0.3);
        }

        .message {
            text-align: center;
            min-height: 20px;
            margin-top: 16px;
            font-size: 13px;
            color: #00e5ff;
        }

        .signup {
            text-align: center;
            color: #aab4d0;
            font-size: 13px;
            margin-top: 20px;
        }

        @media (max-width: 400px) {
            .login-card {
                padding: 32px 22px;
            }

            h1 {
                font-size: 26px;
            }

            .orb {
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="orb one"></div>
        <div class="orb two"></div>
    </div>

    <main class="login-card">

        <div class="logo">✦</div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to continue your journey
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="#" id="forgotLink">Forgot password?</a>
            </div>

            <button type="submit" class="login-button">
                Sign In →
            </button>

            <p class="message" id="message" aria-live="polite"></p>

        </form>

        <p class="signup">
            New here? <a href="#" id="signupLink">Create account</a>
        </p>

    </main>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                message.textContent = "Please fill in all fields.";
                return;
            }

            message.textContent =
                "Demo complete! Connect a backend for real login.";
        });

        document.getElementById("forgotLink").addEventListener(
            "click", function(event) {
                event.preventDefault();
                message.textContent =
                    "Password recovery is not configured in this demo.";
            }
        );

        document.getElementById("signupLink").addEventListener(
            "click", function(event) {
                event.preventDefault();
                message.textContent =
                    "Registration is not configured in this demo.";
            }
        );
    </script>

</body>
</html>
